name: paylocity-daily-sync

"on":
  schedule:
    # 11:00 UTC = 5:00 AM MT (DST) / 4:00 AM MT (winter) — corre antes del dailyDualSystemCheck GAS (1 PM MT)
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: paylocity-daily
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run scrape + POST to GAS
        env:
          PAYLOCITY_STORAGE_STATE_B64: ${{ secrets.PAYLOCITY_STORAGE_STATE_B64 }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
          GAS_URL: ${{ secrets.GAS_URL }}
        run: python scrape.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-logs
          path: |
            *.log
            screenshot*.png
          if-no-files-found: ignore
          retention-days: 7
